services:
  postgres:
    image: postgres:16
    container_name: cedarwood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cedarwood
      POSTGRES_PASSWORD: cedarwood
      POSTGRES_DB: cedarwood
    ports:
      - '5432:5432'
    volumes:
      - cedarwood-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cedarwood']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cedarwood-pgdata:
