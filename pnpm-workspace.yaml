packages:
  - packages/*

# pnpm 11+ reads supply-chain and resolution settings from this file (not package.json "pnpm").

overrides:
  adm-zip@<0.6.0: '>=0.6.0'
  postcss@<8.5.10: '>=8.5.10'
  js-yaml@<3.14.2: '>=3.14.2'
  lodash: 4.18.1
  lodash-es: 4.18.1
  uuid: ^14.0.0
  '@typescript-eslint/parser': ^8.38.0
  eslint-config-next>@typescript-eslint/parser: ^8.38.0
  eslint-plugin-import>@typescript-eslint/parser: ^8.38.0

supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

ignoredOptionalDependencies:
  - '@img/sharp-libvips-darwin-x64'
  - '@img/sharp-libvips-linux-arm'
  - '@img/sharp-libvips-linux-arm64'
  - '@img/sharp-libvips-linux-s390x'
  - '@img/sharp-libvips-linux-x64'
  - '@img/sharp-libvips-linuxmusl-arm64'
  - '@img/sharp-libvips-linuxmusl-x64'
  - '@img/sharp-win32-arm64'
  - '@img/sharp-win32-ia32'
  - '@img/sharp-win32-x64'

# Vendored terminal payment SDKs (file: tarballs) are not on the public npm registry.
minimumReleaseAgeExclude:
  - '@cedarwood/*'
  - '@cedarwood/checkout-sdk'
  - '@cedarwood/pos-terminal'

# Replaces package.json "pnpm.onlyBuiltDependencies" (ignored in pnpm 11).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
